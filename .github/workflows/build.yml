name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Validate client config
        run: |
          python3 - <<'PY'
          import json, re
          c = json.load(open("app/src/main/res/raw/client_config.json"))
          assert c["schema"] == 1, "schema"
          assert re.fullmatch(r"\d+\.\d+\.\d+", c["version"]), "version"
          d = c["discord"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", d["client_version"]), "client_version"
          for k in ("build_number", "native_build_number", "qos_version"):
              assert isinstance(d[k], int) and d[k] > 0, k
          for k in ("electron_version", "chrome_version"):
              assert re.fullmatch(r"\d+(\.\d+){1,3}", d[k]), k
          assert 1 <= len(c["windows"]) <= 20, "windows"
          for w in c["windows"]:
              assert 10000 <= w["build"] <= 99999 and 1 <= w["weight"] <= 1000, w
              assert re.fullmatch(r"\d+\.\d+\.\d+", w["platform_version"]), w
              assert w["revisions"] and all(0 <= r <= 99999 for r in w["revisions"]), w
          print("client_config.json ok, version", c["version"])
          PY
      - name: Lint
        run: ./gradlew ktlintCheck
      - name: Prepare signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.QUESTMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing QUESTMATE_KEYSTORE_BASE64 secret, refusing to publish a release without the signing key"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/questmate.jks"
      - name: Build APK
        env:
          QUESTMATE_KEYSTORE_FILE: ${{ runner.temp }}/questmate.jks
          QUESTMATE_KEYSTORE_PASSWORD: ${{ secrets.QUESTMATE_KEYSTORE_PASSWORD }}
          QUESTMATE_KEY_ALIAS: ${{ secrets.QUESTMATE_KEY_ALIAS }}
          QUESTMATE_KEY_PASSWORD: ${{ secrets.QUESTMATE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --stacktrace \
              -PquestmateVersionName="${GITHUB_REF_NAME#v}" -PquestmateVersionCode="${{ github.run_number }}"
          else
            ./gradlew assembleRelease --stacktrace
          fi
          cp app/build/outputs/apk/release/app-release.apk questmate.apk
      - uses: actions/upload-artifact@v7
        with:
          name: questmate-apk
          path: questmate.apk
          archive: false
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" questmate.apk --title "$GITHUB_REF_NAME" --generate-notes
